name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked

  # Windows-only code (SMTC media session) is compiled out on Linux, so it is
  # linted and tested here. Installer packaging lives in packaging.yml.
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked

  # Android-only code (the AAudio context, the Termux music dir) is compiled
  # out elsewhere, so it is linted for phones here. The tests then run on
  # Android's C library in Termux's container; they use the fake and headless
  # players, so how it sounds still needs a phone.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      # The runner's default NDK is older than the one Termux builds with.
      # The container has no libaaudio; the NDK's stub only lets programs load.
      - name: Select the NDK
        run: |
          grep Pkg.Revision "$ANDROID_NDK_LATEST_HOME/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "AAUDIO_STUB=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/26/libaaudio.so" >> "$GITHUB_ENV"
      - name: Lint
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
        run: cargo clippy --target aarch64-linux-android --all-targets --locked -- -D warnings
      - name: Build tests
        id: tests
        run: echo "dir=$(packaging/termux/build.sh tests x86_64)" >> "$GITHUB_OUTPUT"
      - name: Test in Termux
        env:
          TESTS_DIR: ${{ steps.tests.outputs.dir }}
        run: >-
          docker run --rm --security-opt seccomp=unconfined
          -v "$TESTS_DIR:/tests:ro"
          -v "$AAUDIO_STUB:/system/lib64/libaaudio.so:ro"
          termux/termux-docker:x86_64
          bash -c 'apt-get update && apt-get install -y libsqlite && for test in /tests/*; do "$test" || exit 1; done'
