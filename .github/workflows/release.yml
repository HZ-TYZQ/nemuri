name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$REQUESTED_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
      # Tags up to v1.4.0 were released as music-player, with other file names.
      # Each tag carries the workflow it was built with, so rebuild those from
      # the tag itself instead of teaching this workflow both layouts.
      - name: Check that the tag uses the nemuri layout
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [[ ! -f packaging/nemuri.spec ]]; then
            echo "::error::$RELEASE_TAG predates the rename to nemuri; this workflow cannot build it." >&2
            echo "Rebuild it with the workflow stored in the tag:" >&2
            echo "  gh workflow run release.yml --ref $RELEASE_TAG -f tag=$RELEASE_TAG" >&2
            exit 1
          fi
      - name: Verify project versions
        id: version
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          spec_version=$(sed -n 's/^Version:[[:space:]]*//p' packaging/nemuri.spec | head -n 1)
          tag_version=${{ steps.release.outputs.tag }}
          tag_version=${tag_version#v}
          if [[ -z "$cargo_version" || "$cargo_version" != "$spec_version" || "$cargo_version" != "$tag_version" ]]; then
            echo "Version mismatch: tag=$tag_version cargo=$cargo_version spec=$spec_version" >&2
            exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
      - name: Check release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: test -s "docs/releases/$RELEASE_TAG.md"

  rpm:
    needs: metadata
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build tools
        run: |
          dnf install -y \
            git rust cargo rpm-build tar gzip findutils desktop-file-utils \
            alsa-lib-devel \
            sqlite-devel
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - name: Build RPM and SRPM
        run: ./packaging/build-rpm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: fedora-rpms
          path: |
            packaging/rpmbuild/RPMS/**/*.rpm
            packaging/rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

  windows-build:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build and test release binary
        run: |
          cargo build --release --locked
          cargo test --release --all-targets --locked
      - uses: actions/upload-artifact@v7
        with:
          name: windows-binary
          path: target/release/nemuri.exe
          if-no-files-found: error

  windows-package:
    needs: [metadata, windows-build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: windows-binary
          path: windows-binary
      - name: Install Inno Setup
        shell: pwsh
        run: >-
          ./packaging/windows/install-innosetup.ps1
          -InstallDir "$env:RUNNER_TEMP\innosetup"
          -ExportGitHubEnvironment
      - name: Build Portable ZIP and Installer
        shell: pwsh
        run: >-
          ./packaging/windows/package-windows.ps1
          -ProjectDir "$env:GITHUB_WORKSPACE"
          -ExePath "$env:GITHUB_WORKSPACE\windows-binary\nemuri.exe"
          -Version "${{ needs.metadata.outputs.version }}"
          -OutputDir "$env:RUNNER_TEMP\windows-dist"
      - name: Test Installer behavior
        shell: pwsh
        run: >-
          ./packaging/windows/test-installer.ps1
          -SetupPath "$env:RUNNER_TEMP\windows-dist\nemuri-${{ needs.metadata.outputs.version }}-windows-x86_64-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: ${{ runner.temp }}/windows-dist/*
          if-no-files-found: error

  publish:
    needs: [metadata, rpm, windows-package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-rpms'
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: windows-packages
          path: release-assets
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          find . -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  .*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          body_path: docs/releases/${{ needs.metadata.outputs.tag }}.md
          generate_release_notes: true
          files: release-assets/**/*
