name: Packaging

# Building the RPM and the Windows installer takes most of the CI time and
# repeats the tests CI already runs, so it only runs when packaging inputs
# change. Release-prep commits always touch Cargo.toml and the spec, so the
# packages are still built and the installer tested before every tag; run it
# by hand for anything else.
on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - LICENSE
      - assets/**
      - packaging/**
      - '!packaging/nemuri.1'
      - .github/workflows/packaging.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - LICENSE
      - assets/**
      - packaging/**
      - '!packaging/nemuri.1'
      - .github/workflows/packaging.yml
  workflow_dispatch:

jobs:
  fedora-rpm:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build tools
        run: |
          dnf install -y \
            git rust cargo rpm-build tar gzip findutils desktop-file-utils \
            alsa-lib-devel \
            sqlite-devel
      - uses: actions/checkout@v6
      - name: Build RPM and SRPM
        run: ./packaging/build-rpm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: fedora-rpms-ci
          path: |
            packaging/rpmbuild/RPMS/**/*.rpm
            packaging/rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

  # Mirrors the Release packaging steps so ISS, license staging, and launcher
  # regressions surface before a tag build.
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Resolve project version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Install Inno Setup
        shell: pwsh
        run: >-
          ./packaging/windows/install-innosetup.ps1
          -InstallDir "$env:RUNNER_TEMP\innosetup"
          -ExportGitHubEnvironment
      - name: Build Portable ZIP and Installer
        shell: pwsh
        run: >-
          ./packaging/windows/package-windows.ps1
          -ProjectDir "$env:GITHUB_WORKSPACE"
          -ExePath "$env:GITHUB_WORKSPACE\target\release\nemuri.exe"
          -Version "${{ steps.version.outputs.version }}"
          -OutputDir "$env:RUNNER_TEMP\windows-dist"
      # Before the rename the player was released as music-player; check that
      # its last installer is upgraded in place.
      - name: Download the 1.4.0 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download v1.4.0
          --repo "${{ github.repository }}"
          --pattern "music-player-1.4.0-windows-x86_64-setup.exe"
          --dir "$env:RUNNER_TEMP\previous"
      - name: Test Installer behavior
        shell: pwsh
        run: >-
          ./packaging/windows/test-installer.ps1
          -SetupPath "$env:RUNNER_TEMP\windows-dist\nemuri-${{ steps.version.outputs.version }}-windows-x86_64-setup.exe"
          -PreviousSetupPath "$env:RUNNER_TEMP\previous\music-player-1.4.0-windows-x86_64-setup.exe"
      - name: Retain packages for diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-packages-ci
          path: ${{ runner.temp }}/windows-dist/*
          if-no-files-found: ignore

  # Termux packages for phones (aarch64) and for x86_64, which Termux's
  # container runs, so that one is installed and started there. Mirrors the
  # Release steps.
  termux-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      # The runner's default NDK is older than the one Termux builds with.
      # The container has no libaaudio; the NDK's stub only lets programs load.
      - name: Select the NDK
        run: |
          grep Pkg.Revision "$ANDROID_NDK_LATEST_HOME/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "AAUDIO_STUB=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/26/libaaudio.so" >> "$GITHUB_ENV"
      - name: Build packages
        run: |
          mkdir -p "$RUNNER_TEMP/termux-dist"
          for arch in aarch64 x86_64; do
            cp "$(packaging/termux/build.sh deb "$arch")" "$RUNNER_TEMP/termux-dist/"
          done
      - name: Install and start the x86_64 package in Termux
        run: >-
          docker run --rm --security-opt seccomp=unconfined
          -v "$RUNNER_TEMP/termux-dist:/debs:ro"
          -v "$AAUDIO_STUB:/system/lib64/libaaudio.so:ro"
          termux/termux-docker:x86_64
          bash -c 'apt-get update && apt-get install -y /debs/nemuri_*_x86_64.deb && nemuri --version && nemuri --help > /dev/null'
      - uses: actions/upload-artifact@v7
        with:
          name: termux-debs-ci
          path: ${{ runner.temp }}/termux-dist/*.deb
          if-no-files-found: error
