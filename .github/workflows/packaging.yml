name: Packaging

# Building the RPM, the Arch package and the Windows installer takes most of
# the CI time and repeats the tests CI already runs, so it only runs when
# packaging inputs change. Release-prep commits always touch Cargo.toml, the
# spec and the PKGBUILD, so the packages are still built and the installers
# tested before every tag; run it by hand for anything else.
on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - LICENSE
      - assets/**
      - packaging/**
      - '!packaging/nemuri.1'
      - .github/workflows/packaging.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - LICENSE
      - assets/**
      - packaging/**
      - '!packaging/nemuri.1'
      - .github/workflows/packaging.yml
  workflow_dispatch:

jobs:
  fedora-rpm:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build tools
        run: |
          dnf install -y \
            git rust cargo rpm-build tar gzip findutils desktop-file-utils \
            alsa-lib-devel \
            sqlite-devel
      - uses: actions/checkout@v6
      - name: Build RPM and SRPM
        run: ./packaging/build-rpm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: fedora-rpms-ci
          path: |
            packaging/rpmbuild/RPMS/**/*.rpm
            packaging/rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

  # Built under stock Arch makepkg.conf, so it targets baseline x86-64 and
  # installs on Arch and its derivatives. Mirrors the Release steps.
  arch-package:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --needed --noconfirm \
            base-devel git rust desktop-file-utils \
            alsa-lib hicolor-icon-theme sqlite
      - uses: actions/checkout@v6
      # makepkg refuses to run as root.
      - name: Build Arch package
        run: |
          useradd --create-home builder
          chown -R builder .
          runuser -u builder -- ./packaging/build-arch.sh
      - uses: actions/upload-artifact@v7
        with:
          name: arch-packages-ci
          path: packaging/archbuild/*.pkg.tar.zst
          if-no-files-found: error

  # A fresh container has none of the runtime libraries, so this checks that
  # depends= alone lets pacman install the package and the binary start.
  arch-install:
    needs: arch-package
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: arch-packages-ci
          path: arch-dist
      - name: Install and start the package
        run: |
          pacman -Syu --noconfirm
          pacman -U --noconfirm arch-dist/nemuri-*-x86_64.pkg.tar.zst
          nemuri --version
          nemuri --help > /dev/null

  # Mirrors the Release packaging steps so ISS, license staging, and launcher
  # regressions surface before a tag build.
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Resolve project version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Install Inno Setup
        shell: pwsh
        run: >-
          ./packaging/windows/install-innosetup.ps1
          -InstallDir "$env:RUNNER_TEMP\innosetup"
          -ExportGitHubEnvironment
      - name: Build Portable ZIP and Installer
        shell: pwsh
        run: >-
          ./packaging/windows/package-windows.ps1
          -ProjectDir "$env:GITHUB_WORKSPACE"
          -ExePath "$env:GITHUB_WORKSPACE\target\release\nemuri.exe"
          -Version "${{ steps.version.outputs.version }}"
          -OutputDir "$env:RUNNER_TEMP\windows-dist"
      # Before the rename the player was released as music-player; check that
      # its last installer is upgraded in place.
      - name: Download the 1.4.0 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download v1.4.0
          --repo "${{ github.repository }}"
          --pattern "music-player-1.4.0-windows-x86_64-setup.exe"
          --dir "$env:RUNNER_TEMP\previous"
      - name: Test Installer behavior
        shell: pwsh
        run: >-
          ./packaging/windows/test-installer.ps1
          -SetupPath "$env:RUNNER_TEMP\windows-dist\nemuri-${{ steps.version.outputs.version }}-windows-x86_64-setup.exe"
          -PreviousSetupPath "$env:RUNNER_TEMP\previous\music-player-1.4.0-windows-x86_64-setup.exe"
      - name: Retain packages for diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-packages-ci
          path: ${{ runner.temp }}/windows-dist/*
          if-no-files-found: ignore
