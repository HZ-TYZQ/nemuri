[package]
name = "nemuri"
version = "2.3.0"
edition = "2024"
description = "A terminal player for ASMR and music"
license = "MIT"
readme = "README.md"
repository = "https://github.com/HZ-TYZQ/nemuri"
homepage = "https://github.com/HZ-TYZQ/nemuri"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
encoding_rs = "0.8.35"
kdl = { version = "6.7.1", default-features = false, features = ["span"] }
lofty = "0.25.1"
nucleo = "0.5.0"
ratatui = "0.30.2"
rodio = { version = "0.22.2", features = ["symphonia-aiff"] }
rusqlite = { version = "0.40.2", features = ["bundled-windows"] }
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.4"
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2"
mpris-server = "0.10"
percent-encoding = "2.3"
pollster = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Media",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"
