<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Music Player</title>
  <desc id="description">A three-bar monochrome audio spectrum on a graphite plate, tuned for small sizes.</desc>
  <defs>
    <linearGradient id="spectrum" x1="192" y1="0" x2="704" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A8A8A8"/>
      <stop offset="1" stop-color="#F2F2F2"/>
    </linearGradient>
  </defs>
  <rect x="88" y="88" width="848" height="848" rx="232" fill="#181B24"/>
  <g fill="url(#spectrum)">
    <rect x="192" y="452" width="128" height="288" rx="24"/>
    <rect x="448" y="284" width="128" height="456" rx="24"/>
    <rect x="704" y="476" width="128" height="264" rx="24"/>
  </g>
</svg>
